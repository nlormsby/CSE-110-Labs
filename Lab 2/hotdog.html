<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="hamburger.css">
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Form with JavaScript Inputs</title>
</head>

<body>
   <div class="container">
       <h2>Create Your Sticky Note!</h2>
       <form id="userForm">
           <label for="title">Title:</label>
           <input type="text" id="title" name="title" size="23" required>
           <label for="content">Content:</label>
           <input type="text" id="content" name="content" size="23" required>
           <label for="notel">Label Your Note:</label>
           <select name="notel" id="notel">
            <option value="">--Please choose an option--</option>
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
            <option value="Other">Other</option>
            </select>
            <br>
           <button type="submit">Submit</button>
       </form>

       <div class="result" id="result"></div>
   </div>
   <script src="pizza.js"></script>

</body>

</html>
